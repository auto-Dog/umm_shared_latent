# 120K (60K CC12M + 60K OmniEdit) local PT profile. A tenth of the 1.2M baseline,
# sized to finish on a single 24GB GPU in ~1.7 days. Local weights, mirrored data.
extends: local_pt.yaml

data:
  sources:
    - kind: cc12m
      path: pixparse/cc12m-wds
      split: train
      sample_count: 60000
      seed_offset: 0
    - kind: omniedit
      path: TIGER-Lab/OmniEdit-Filtered-1.2M
      split: train
      sample_count: 60000
      seed_offset: 1

training:
  output_dir: outputs/pt_60k
  run_name: uniquery-pt-60k
  report_to: tensorboard
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  # Stabilization pass (2026-09-24): grad_norm was clipping on 100% of steps with a
  # flat flow_loss ~0.99. Smaller LR, 4x effective batch (8 -> 32 samples/step), and a
  # longer warmup cut the gradient variance that was destroying the updates.
  learning_rate: 5e-5
  gradient_accumulation_steps: 32
  warmup_ratio: 0.1
  # Local single-card bring-up cannot run deepspeed ZeRO-1: fp32 optimizer state for
  # the full 311M-row embedding OOMs a 24GB card. The remote 8xGPU run keeps it on
  # (baseline_pt.yaml); torch fused AdamW is enough here.
  # TODO: drop this once the embedding tail rows become a separate trainable parameter.
  deepspeed: null
