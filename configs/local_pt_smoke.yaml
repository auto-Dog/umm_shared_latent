# Small end-to-end runtime profile. It is intentionally not used by baseline runs.
extends: local_pt.yaml

data:
  sources:
    - kind: cc12m
      path: pixparse/cc12m-wds
      split: train
      sample_count: 300
      seed_offset: 0
    - kind: omniedit
      path: TIGER-Lab/OmniEdit-Filtered-1.2M
      split: train
      sample_count: 300
      seed_offset: 1

training:
  output_dir: outputs/smoke_pt
  run_name: uniquery-smoke-pt
  report_to: none
  logging_steps: 5
  save_steps: 10
  save_total_limit: 2
