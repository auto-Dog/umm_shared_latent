# InternVL3-1B backbone, full intended PT mix: 600K CC12M + 600K OmniEdit-1.2M
# (streaming). Mirrors the OpenUni internvl3_1b_sana_0_6b_512_stream_pt profile:
# frozen 1B LLM + frozen Sana, batch 8, no activation checkpointing, flash attention.
# Streaming keeps downloads progressive: each shard is fetched lazily as iteration
# reaches it and cached on disk; nothing is pulled up front.
extends: local_pt.yaml

model:
  backbone: internvl3
  ivl3_id: /home/mingjun/OpenUni/OpenUni_MME/models/InternVL3-1B
  sana_id: /data/mingjun/sana
  vae_id: /data/mingjun/sana/vae
  attention_backend: flash_attention_2  # falls back to eager if flash_attn is absent
  # The MetaQuery embedding rows ARE trainable inside the frozen LLM, so autograd
  # retains every LLM layer's activations (~8GB at batch 8). Gradient checkpointing
  # recomputes them on backward instead — without it the 24GB cards OOM when shared
  # with other jobs. (The "nothing trainable behind checkpointing" comment was wrong.)
  gradient_checkpointing: true
  train_flow_model: false
  trainable_parameter_guard_m: null

data:
  image_size: 512
  shuffle_buffer: 500
  sources:
    - kind: cc12m
      path: pixparse/cc12m-wds
      split: train
      sample_count: 600000
      seed_offset: 0
    - kind: omniedit
      path: TIGER-Lab/OmniEdit-Filtered-1.2M
      split: train
      sample_count: 600000
      seed_offset: 1

training:
  output_dir: outputs/pt_ivl3
  run_name: uniquery-pt-ivl3
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 5e-5
  weight_decay: 0.05
  warmup_ratio: 0.05
  deepspeed: null
