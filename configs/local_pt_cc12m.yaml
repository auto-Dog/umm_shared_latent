# Stage 1: caption->image PT on CC12M only (no OmniEdit mixing). Fine-tunes the
# Sana flow model alongside the connector (reference-MetaQuery behavior), so this
# stage's adapter is the init checkpoint for local_pt_edit.yaml.
extends: local_pt.yaml

model:
  train_flow_model: true
  trainable_parameter_guard_m: null

data:
  sources:
    - kind: cc12m
      path: pixparse/cc12m-wds
      split: train
      sample_count: 60000
      seed_offset: 0

training:
  output_dir: outputs/pt_cc12m
  run_name: uniquery-pt-cc12m
  report_to: none
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  # Stabilization pass shared with local_pt_60k.yaml.
  learning_rate: 5e-5
  gradient_accumulation_steps: 32
  warmup_ratio: 0.1
  # Single-card bring-up cannot run deepspeed ZeRO-1: fp32 optimizer state for the
  # full 311M-row embedding OOMs a 24GB card.
  deepspeed: null
