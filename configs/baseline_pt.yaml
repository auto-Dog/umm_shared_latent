stage: pt
seed: 42

model:
  mllm_id: Qwen/Qwen2.5-VL-3B-Instruct
  sana_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  vae_id: mit-han-lab/dc-ae-f32c32-sana-1.1-diffusers
  torch_dtype: bfloat16
  attention_backend: sdpa
  gradient_checkpointing: false
  generation_system_prompt: You are a unified model. Generate the image described by the user input. The image query tokens in the sequence represent the image to generate.
  min_pixels: 200704
  max_pixels: 1000000
  connector:
    type: light_transformer
    num_queries: 256
    hidden_size: 896
    intermediate_size: 4096
    num_hidden_layers: 6
    num_attention_heads: 14
    dropout: 0.0
  losses:
    flow_weight: 1.0
    latent_alignment_weight: 0.0
    query_diversity_weight: 0.0
  trainable_parameter_guard_m: [70, 140]
  init_checkpoint: null

# Provenance for the external base models this config depends on. The model.*_id
# fields above may point at Hub ids or at machine-local copies (see
# local_pt.yaml); this section records the authoritative model name and official
# source for each field, so a fresh machine can re-fetch from here when local
# paths change. validate_config enforces that every referenced model.*_id has a
# matching entry. Entries merge across extends (child keys add, not replace).
model_dependency:
  mllm_id:
    name: Qwen2.5-VL-3B-Instruct (Qwen 版冻结 MLLM backbone)
    repo: https://huggingface.co/Qwen/Qwen2.5-VL-3B-Instruct
  sana_id:
    name: Sana 0.6B (Sana_600M_512px_diffusers)
    repo: https://huggingface.co/Efficient-Large-Model/Sana_600M_512px_diffusers
  vae_id:
    name: DC-AE f32c32 (Sana 1.1 VAE, 32 latent channels)
    repo: https://huggingface.co/mit-han-lab/dc-ae-f32c32-sana-1.1-diffusers

data:
  streaming: true
  image_size: 512
  max_input_text_tokens: 256
  # A 10k streaming shuffle downloads roughly 10k remote examples before yielding
  # the first batch. 500 preserves bounded shuffling without the apparent startup hang.
  shuffle_buffer: 500
  system_prompt: You are a unified model. Generate the image described by the user input. The image query tokens in the sequence represent the image to generate.
  sources:
    - kind: cc12m
      path: pixparse/cc12m-wds
      split: train
      sample_count: 600000
      seed_offset: 0
    - kind: omniedit
      path: TIGER-Lab/OmniEdit-Filtered-1.2M
      split: train
      sample_count: 600000
      seed_offset: 1

training:
  output_dir: outputs/baseline_pt
  run_name: uniquery-baseline-pt
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.1
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  max_steps: null
  bf16: true
  tf32: true
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  dataloader_num_workers: 0
  dataloader_pin_memory: true
  optim: adamw_torch_fused
  report_to: tensorboard
  deepspeed: configs/deepspeed_zero1.json
  failure_recovery:
    enabled: true
    auto_resume: true
    max_restarts: 30
    monitor_interval_seconds: 5
